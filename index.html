<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AIBrainBox</title>

    <meta
        name="description"
        content="AIBrainBox — practice AI questions, test your knowledge, and improve your skills."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>AIBrainBox</h1>
            <p>AI Questions • Practice • Learn • Improve</p>
        </header>


        <!-- Motivational quote is injected here by app.js -->


        <section
            id="loading"
            class="loading"
        >
            Loading question...
        </section>


        <section
            id="error"
            class="error hidden"
            role="alert"
        ></section>


        <section
            id="question-container"
            class="hidden"
        >

            <div class="question-card">

                <div
                    id="question"
                    class="question"
                ></div>


                <div
                    id="options"
                    class="options"
                ></div>


                <div
                    id="result"
                    aria-live="polite"
                ></div>


                <button
                    id="show-explanation-btn"
                    class="explanation-button hidden"
                    type="button"
                    onclick="toggleExplanation()"
                >
                    💡 Show Explanation
                </button>


                <div
                    id="explanation"
                    class="explanation hidden"
                >

                    <h2>Explanation</h2>

                    <div
                        id="explanation-text"
                    ></div>

                </div>


                <!-- Previous / Next navigation is
                     automatically inserted by app.js -->

            </div>

        </section>


        <footer class="footer">

            <p>
                Keep learning. Keep improving. 🚀
            </p>

        </footer>

    </main>


    <script src="app.js"></script>

</body>
</html>
