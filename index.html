<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A box full of ahaaaaaaa8 questions!!"
    >

    <title>AIBrainBox</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="light-theme">


    <!-- =================================================
         GEN-Z BACKGROUND
         ================================================= -->

    <div
        id="background-overlay"
        aria-hidden="true"
    ></div>


    <main class="page-wrapper">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="brain-box-header">


            <div class="brand-area">

                <div class="brand-title">
                    🧠AIBrainBox
                </div>


                <div class="brand-tagline">
                    A box full of ahaaaaaaa8 questions!!
                </div>


                <!-- Caption intentionally hidden -->

                <div
                    class="brand-subtitle"
                    style="display: none;"
                ></div>

            </div>


            <!-- =================================================
                 CURRENT STREAK
                 ================================================= -->

            <div
                id="score-display"
                class="score-display"
                aria-live="polite"
            >
                Current streak:
                <strong>0</strong>
            </div>


            <!-- =================================================
                 QUOTE
                 ================================================= -->

            <div class="quote-section">

                <div
                    id="quote-text"
                    class="quote-text"
                >
                    “Keep learning. Keep improving.”
                </div>


                <div
                    id="quote-author"
                    class="quote-author"
                >
                    — AIBrainBox
                </div>

            </div>

        </header>


        <!-- =================================================
             QUIZ AREA
             ================================================= -->

        <section
            id="quiz-area"
            class="quiz-area"
        >


            <!-- =================================================
                 ERROR
                 ================================================= -->

            <div
                id="error"
                class="error hidden"
                role="alert"
            ></div>


            <!-- =================================================
                 QUESTION CONTAINER
                 ================================================= -->

            <section
                id="question-container"
                class="question-container hidden"
            >


                <!-- =================================================
                     RANDOM QUESTION NAVIGATION
                     
                     IMPORTANT:
                     Previous and Next are now RANDOM.
                     
                     They no longer follow:
                     - CSV order
                     - Previous Related Question
                     - Next Related Question
                     ================================================= -->

                <div
                    class="related-navigation"
                    aria-label="Random question navigation"
                >


                    <!-- =================================================
                         RANDOM PREVIOUS QUESTION
                         ================================================= -->

                    <button
                        id="previous-question"
                        class="related-question previous-related"
                        type="button"
                        aria-label="Previous random question"
                        title="Previous random question"
                    >
                        ←
                    </button>


                    <!-- =================================================
                         RANDOM NEXT QUESTION
                         ================================================= -->

                    <button
                        id="next-question"
                        class="related-question next-related"
                        type="button"
                        aria-label="Next random question"
                        title="Next random question"
                    >
                        →
                    </button>

                </div>


                <!-- =================================================
                     TWO COLUMN LAYOUT
                     ================================================= -->

                <div class="quiz-columns">


                    <!-- =================================================
                         QUESTION
                         ================================================= -->

                    <section
                        class="question-pane"
                        aria-labelledby="question"
                    >

                        <div class="pane-label">
                            Question
                        </div>


                        <div
                            id="question"
                            class="question"
                        ></div>

                    </section>


                    <!-- =================================================
                         OPTIONS
                         ================================================= -->

                    <section
                        class="options-pane"
                        aria-label="Answer options"
                    >

                        <div class="pane-label">
                            Choose your answer
                        </div>


                        <div
                            id="options"
                            class="options"
                        ></div>


                        <!-- =================================================
                             RESULT
                             ================================================= -->

                        <div
                            id="result"
                            class="result"
                            aria-live="polite"
                        ></div>


                        <!-- =================================================
                             EXPLANATION
                             ================================================= -->

                        <div
                            id="explanation"
                            class="explanation hidden"
                        >

                            <div class="explanation-title">
                                💡 Explanation
                            </div>


                            <div
                                id="explanation-text"
                                class="explanation-text"
                            ></div>

                        </div>

                    </section>

                </div>

            </section>

        </section>

    </main>


    <!-- =================================================
         JAVASCRIPT
         ================================================= -->

    <script
        src="app.js"
        defer
    ></script>


</body>

</html>
