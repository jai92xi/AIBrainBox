<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI BrainBox</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <header>
        <div class="header-content">
            <h1>🧠 AI BrainBox</h1>
            <p>Test your AI knowledge</p>
        </div>
    </header>

    <main>

        <div
            id="loading"
            class="loading"
        >
            Loading questions...
        </div>

        <div
            id="error"
            class="error hidden"
        >
            Unable to load questions.
        </div>

        <section
            id="question-container"
            class="hidden"
            aria-label="Quiz question"
        >

            <div id="quiz-navigation-toolbar"></div>

            <div class="quiz-layout">

                <div class="question-section">

                    <div
                        id="question"
                        class="question"
                    ></div>

                    <div
                        id="options"
                        class="options"
                    ></div>

                    <div
                        id="result"
                        class="result"
                    ></div>

                    <button
                        id="show-explanation-btn"
                        type="button"
                        class="hidden"
                        onclick="toggleExplanation()"
                    >
                        💡 Show Explanation
                    </button>

                    <div
                        id="explanation"
                        class="explanation hidden"
                    >

                        <h3>
                            💡 Explanation
                        </h3>

                        <div
                            id="explanation-text"
                        ></div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>AI BrainBox</p>
    </footer>

    <script src="app.js"></script>

</body>

</html>
