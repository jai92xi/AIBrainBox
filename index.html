<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AIBrainBox - AI Questions & Practice"
    >

    <title>
        AIBrainBox - AI Questions & Practice
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div id="background-overlay"></div>


    <!-- =====================================================
         MAIN APPLICATION
         ===================================================== -->

    <div class="app-container">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="brain-box-header">

            <div class="brand-section">

                <h1>
                    AIBrainBox
                </h1>

                <div class="brand-subtitle">
                    AI Questions &amp; Practice...
                </div>

            </div>


            <!-- Current streak -->

            <div
                id="score-display"
                class="score-display"
            >
                Current streak:
                <strong>0</strong>
            </div>


            <!-- Quote -->

            <div class="quote-section">

                <div
                    id="quote-text"
                    class="quote-text"
                ></div>

                <div
                    id="quote-author"
                    class="quote-author"
                ></div>

            </div>

        </header>



        <!-- =================================================
             LOADING
             ================================================= -->

        <div
            id="loading"
            class="loading"
        >

            <div class="loading-spinner"></div>

            <div>
                Loading question...
            </div>

        </div>



        <!-- =================================================
             ERROR
             ================================================= -->

        <div
            id="error"
            class="error hidden"
        ></div>



        <!-- =================================================
             QUESTION CONTAINER
             ================================================= -->

        <main
            id="question-container"
            class="question-container hidden"
        >


            <!-- =============================================
                 RELATED QUESTION NAVIGATION
                 ============================================= -->

            <div class="related-navigation">

                <button
                    id="previous-question"
                    class="related-question"
                    type="button"
                    aria-label="Previous related question"
                    title="Previous related question"
                >
                    ←
                </button>


                <button
                    id="next-question"
                    class="related-question"
                    type="button"
                    aria-label="Next related question"
                    title="Next related question"
                >
                    →
                </button>

            </div>



            <!-- =============================================
                 QUESTION + OPTIONS
                 ============================================= -->

            <div class="question-content">


                <!-- =========================================
                     QUESTION PANE
                     ========================================= -->

                <section class="question-pane">

                    <div class="question-label">
                        QUESTION
                    </div>


                    <div
                        id="question"
                        class="question"
                    ></div>

                </section>



                <!-- =========================================
                     OPTIONS PANE
                     ========================================= -->

                <section class="options-pane">

                    <div class="question-label">
                        SELECT YOUR ANSWER
                    </div>


                    <!-- Options are dynamically generated -->

                    <div
                        id="options"
                        class="options"
                    ></div>



                    <!-- =====================================
                         RESULT
                         ===================================== -->

                    <div
                        id="result"
                        class="result"
                    ></div>



                    <!-- =====================================
                         EXPLANATION
                         ===================================== -->

                    <div
                        id="explanation"
                        class="explanation hidden"
                    >

                        <div class="explanation-header">

                            <span class="explanation-icon">
                                💡
                            </span>

                            <span>
                                Explanation
                            </span>

                        </div>


                        <div
                            id="explanation-text"
                            class="explanation-text"
                        ></div>

                    </div>

                </section>

            </div>

        </main>

    </div>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="app.js"
        defer
    ></script>

</body>

</html>
