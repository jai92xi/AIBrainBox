<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AIBrainBox - AI Questions & Practice"
    >

    <title>AIBrainBox - AI Questions & Practice</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- Background -->
    <div
        id="background-overlay"
        aria-hidden="true"
    ></div>


    <!-- Main Application -->
    <main class="app-container">

        <!-- Top Header -->
        <header class="brain-box-header">

            <!-- Brand -->
            <div class="brand-section">
                <h1>AIBrainBox</h1>
                <p class="brand-subtitle">
                    AI Questions &amp; Practice...
                </p>
            </div>


            <!-- Current Streak -->
            <div
                id="score-display"
                class="score-display"
            >
                🔥 Current streak:
                <strong>0/0</strong>
            </div>


            <!-- Quote -->
            <div class="quote-section">

                <div
                    id="quote-text"
                    class="quote-text"
                >
                    “Keep learning. Keep improving.”
                </div>

                <div
                    id="quote-author"
                    class="quote-author"
                >
                    — AIBrainBox
                </div>

            </div>

        </header>


        <!-- Loading -->
        <div
            id="loading"
            class="loading"
        >
            <div class="loading-spinner"></div>

            <p>
                Loading question...
            </p>
        </div>


        <!-- Error -->
        <div
            id="error"
            class="error hidden"
            role="alert"
        >
            Unable to load the question database.
            Please check that xi-questions.csv exists
            in the repository.
        </div>


        <!-- Question Area -->
        <section
            id="question-container"
            class="question-container hidden"
        >

            <!-- Question -->
            <div class="question-section">

                <div
                    id="question"
                    class="question"
                ></div>

            </div>


            <!-- Options -->
            <div
                id="options"
                class="options"
                role="group"
                aria-label="Answer options"
            ></div>


            <!-- Result -->
            <div
                id="result"
                class="result"
                aria-live="polite"
            ></div>


            <!-- Explanation -->
            <section
                id="explanation"
                class="explanation hidden"
            >

                <div class="explanation-header">
                    <span class="explanation-icon">
                        💡
                    </span>

                    <span>
                        Explanation
                    </span>
                </div>

                <div
                    id="explanation-text"
                    class="explanation-text"
                ></div>

            </section>

        </section>

    </main>


    <!-- Application Script -->
    <script
        src="app.js"
        defer
    ></script>

</body>
</html>
