<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A box full of ahaaaaaaa8 questions!!"
    >

    <title>AIBrainBox</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="light-theme">

    <!-- =================================================
         BACKGROUND
         ================================================= -->

    <div
        id="background-overlay"
        aria-hidden="true"
    ></div>


    <!-- =================================================
         MAIN PAGE
         ================================================= -->

    <main class="page-wrapper">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="brain-box-header">

            <div class="brand-area">

                <div class="brand-title">
                    🧠 AIBrainBox
                </div>

                <div class="brand-tagline">
                    A box full of ahaaaaaaa8 questions!!
                </div>

                <!-- Kept for app.js compatibility -->
                <div
                    class="brand-subtitle"
                    style="display: none;"
                ></div>

            </div>


            <!-- =================================================
                 SCORE / STREAK
                 ================================================= -->

            <div
                id="score-display"
                class="score-display"
                aria-live="polite"
            >
                Current streak:
                <strong>0</strong>
            </div>


            <!-- =================================================
                 DAILY / RANDOM QUOTE
                 ================================================= -->

            <div class="quote-section">

                <div
                    id="quote-text"
                    class="quote-text"
                >
                    “Keep learning. Keep improving.”
                </div>

                <div
                    id="quote-author"
                    class="quote-author"
                >
                    — AIBrainBox
                </div>

            </div>

        </header>


        <!-- =================================================
             QUIZ AREA
             ================================================= -->

        <section
            id="quiz-area"
            class="quiz-area"
        >


            <!-- =================================================
                 ERROR MESSAGE
                 ================================================= -->

            <div
                id="error"
                class="error hidden"
                role="alert"
            ></div>


            <!-- =================================================
                 QUESTION CONTAINER
                 ================================================= -->

            <section
                id="question-container"
                class="question-container hidden"
            >


                <!-- =================================================
                     RANDOM NAVIGATION

                     IMPORTANT:

                     Previous and Next are RANDOM.

                     They do NOT use:

                     - CSV row order
                     - previous related question
                     - next related question

                     app.js maintains a history of already
                     displayed questions so questions do not
                     repeat until the current cycle is complete.
                     ================================================= -->

                <nav
                    class="related-navigation"
                    aria-label="Random question navigation"
                >


                    <!-- =================================================
                         PREVIOUS RANDOM QUESTION
                         ================================================= -->

                    <button
                        id="previous-question"
                        class="related-question previous-related"
                        type="button"
                        aria-label="Previous random question"
                        title="Random question"
                    >
                        <span aria-hidden="true">
                            ←
                        </span>
                    </button>


                    <!-- =================================================
                         NEXT RANDOM QUESTION
                         ================================================= -->

                    <button
                        id="next-question"
                        class="related-question next-related"
                        type="button"
                        aria-label="Next random question"
                        title="Random question"
                    >
                        <span aria-hidden="true">
                            →
                        </span>
                    </button>

                </nav>


                <!-- =================================================
                     QUIZ TWO-COLUMN LAYOUT
                     ================================================= -->

                <div class="quiz-columns">


                    <!-- =================================================
                         QUESTION PANE
                         ================================================= -->

                    <section
                        class="question-pane"
                        aria-labelledby="question-label"
                    >

                        <div
                            id="question-label"
                            class="pane-label"
                        >
                            Question
                        </div>


                        <div
                            id="question"
                            class="question"
                        ></div>

                    </section>


                    <!-- =================================================
                         ANSWER OPTIONS PANE
                         ================================================= -->

                    <section
                        class="options-pane"
                        aria-label="Answer options"
                    >

                        <div class="pane-label">
                            Choose your answer
                        </div>


                        <!-- =================================================
                             OPTIONS

                             app.js dynamically creates:

                             A
                             B
                             C
                             D
                             ================================================= -->

                        <div
                            id="options"
                            class="options"
                        ></div>


                        <!-- =================================================
                             ANSWER RESULT
                             ================================================= -->

                        <div
                            id="result"
                            class="result"
                            aria-live="polite"
                        ></div>


                        <!-- =================================================
                             EXPLANATION
                             ================================================= -->

                        <div
                            id="explanation"
                            class="explanation hidden"
                        >

                            <div class="explanation-title">
                                💡 Explanation
                            </div>


                            <div
                                id="explanation-text"
                                class="explanation-text"
                            ></div>

                        </div>

                    </section>

                </div>

            </section>

        </section>

    </main>


    <!-- =================================================
         APPLICATION JAVASCRIPT
         ================================================= -->

    <script
        src="app.js"
        defer
    ></script>

</body>

</html>
