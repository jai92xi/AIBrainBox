<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AIBrainBox — practice AI questions, test your knowledge, and improve your skills."
    >

    <title>🧠 AIBrainBox</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="container">

        <header class="header">

            <div class="brand-icon">
                🧠
            </div>

            <h1>AIBrainBox</h1>

            <p>
                AI Questions • Practice • Learn • Improve * trail 3
            </p>

        </header>


        <!-- Motivational quote -->
        <aside
            id="motivational-quote"
            class="motivational-quote"
            aria-label="Motivational quote"
        >

            <div
                id="quote-text"
                class="quote-text"
            >
                Keep learning. Keep improving.
            </div>

            <div
                id="quote-author"
                class="quote-author"
            ></div>

        </aside>


        <!-- Loading -->
        <section
            id="loading"
            class="loading"
        >
            Loading question...
        </section>


        <!-- Error -->
        <section
            id="error"
            class="error hidden"
            role="alert"
        ></section>


        <!-- Quiz -->
        <section
            id="question-container"
            class="hidden"
        >

            <!-- Top navigation / progress -->
            <nav
                id="question-navigation"
                class="question-navigation"
                aria-label="Question navigation"
            >

                <button
                    id="previous-question-btn"
                    type="button"
                >
                    ← Previous
                </button>


                <div
                    id="question-position"
                    class="question-position"
                >
                    Question 1 of 5
                </div>


                <div
                    id="score-display"
                    class="score-display"
                >
                    Your current streak -
                    <strong>0/0</strong>
                </div>


                <button
                    id="next-question-btn"
                    type="button"
                >
                    Next →
                </button>

            </nav>


            <!-- Question and options -->
            <div class="question-card">

                <div class="quiz-layout">

                    <!-- LEFT: QUESTION -->
                    <section class="question-panel">

                        <div class="panel-label">
                            🧠 QUESTION
                        </div>

                        <div
                            id="question"
                            class="question"
                        ></div>

                    </section>


                    <!-- RIGHT: OPTIONS -->
                    <section class="options-panel">

                        <div class="panel-label">
                            🤖 SELECT YOUR ANSWER
                        </div>


                        <div
                            id="options"
                            class="options"
                            role="radiogroup"
                            aria-label="Answer options"
                        ></div>


                        <!-- Answer result -->
                        <div
                            id="result"
                            class="result"
                            aria-live="polite"
                        ></div>


                        <!--
                            app.js will insert
                            "Show Explanation"
                            here after an answer
                            is selected.
                        -->

                        <div
                            id="explanation"
                            class="explanation hidden"
                        >

                            <div class="explanation-title">
                                💡 Explanation
                            </div>

                            <div
                                id="explanation-text"
                                class="explanation-text"
                            ></div>

                        </div>

                    </section>

                </div>

            </div>

        </section>


        <!-- Footer -->
        <footer class="footer">

            <p>
                Keep learning. Keep improving. 🚀
            </p>

        </footer>

    </main>


    <script src="app.js"></script>

</body>

</html>
