<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AIBrainBox</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🧠 AIBrainBox</h1>
        <p>AI Questions & Practice</p>
    </header>

    <main>

        <div id="loading">
            Loading question...
        </div>

        <div id="error" class="hidden"></div>

        <div id="question-container" class="hidden">

            <div class="question-header">
                <span id="question-id"></span>
                <span id="topic"></span>
            </div>

            <div class="quiz-layout">

                <!-- LEFT: QUESTION -->
                <div class="question-panel">

                    <div class="panel-label">
                        🧠 QUESTION
                    </div>

                    <div id="question"></div>

                </div>

                <!-- RIGHT: OPTIONS -->
                <div class="options-panel">

                    <div class="panel-label">
                        🤖 SELECT YOUR ANSWER
                    </div>

                    <div id="options"></div>

                    <button id="submit-btn" onclick="submitAnswer()">
                        Check Answer 🚀
                    </button>

                </div>

            </div>

            <!-- RESULT -->
            <div id="result"></div>

            <!-- EXPLANATION -->
            <div id="explanation" class="hidden">

                <h3>💡 Explanation</h3>

                <div id="explanation-text"></div>

            </div>

            <!-- SHOW EXPLANATION -->
            <button id="show-explanation-btn" class="hidden" onclick="toggleExplanation()">
                💡 Show Explanation
            </button>

            <!-- COPY LINK -->
            <button id="copy-btn" onclick="copyLink()">
                🔗 Copy Question Link
            </button>

        </div>

    </main>

    <footer>
        <p>🧠 AIBrainBox • AI Questions & Practice</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
