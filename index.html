<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">

```
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="AI Brain Box — Test your AI and Machine Learning knowledge."
>

<title>AI Brain Box</title>

<link
    rel="stylesheet"
    href="style.css"
>
```

</head>

<body class="light-theme">

```
<!-- Background -->
<div
    id="background-overlay"
    aria-hidden="true"
></div>


<main class="page-wrapper">

    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="brain-box-header">

        <div class="brand-area">

            <div class="brand-title">
                🧠 AI Brain Box
            </div>

            <!-- Caption intentionally hidden -->
            <div
                class="brand-subtitle"
                style="display: none;"
            ></div>

        </div>


        <!-- Current Streak -->
        <div
            id="score-display"
            class="score-display"
            aria-live="polite"
        >
            Current streak:
            <strong>0</strong>
        </div>


        <!-- Quote inside header -->
        <div class="quote-section">

            <div
                id="quote-text"
                class="quote-text"
            >
                “Keep learning. Keep improving.”
            </div>

            <div
                id="quote-author"
                class="quote-author"
            >
                — AIBrainBox
            </div>

        </div>

    </header>


    <!-- =================================================
         QUIZ AREA
         ================================================= -->

    <section
        id="quiz-area"
        class="quiz-area"
    >

        <!-- Loading -->
        <div
            id="loading"
            class="loading"
        >
            Loading question...
        </div>


        <!-- Error -->
        <div
            id="error"
            class="error hidden"
            role="alert"
        ></div>


        <!-- =================================================
             QUESTION CONTAINER
             ================================================= -->

        <section
            id="question-container"
            class="question-container hidden"
        >

            <!--
                app.js inserts the
                previous / next arrows here.
            -->


            <!-- =================================================
                 TWO COLUMN QUIZ LAYOUT
                 ================================================= -->

            <div class="quiz-columns">


                <!-- =============================================
                     LEFT: QUESTION
                     ============================================= -->

                <section
                    class="question-pane"
                    aria-labelledby="question"
                >

                    <div class="pane-label">
                        Question
                    </div>

                    <div
                        id="question"
                        class="question"
                    ></div>

                </section>


                <!-- =============================================
                     RIGHT: OPTIONS
                     ============================================= -->

                <section
                    class="options-pane"
                    aria-label="Answer options"
                >

                    <div class="pane-label">
                        Choose your answer
                    </div>


                    <!-- Options inserted by app.js -->
                    <div
                        id="options"
                        class="options"
                    ></div>


                    <!-- Result -->
                    <div
                        id="result"
                        class="result"
                        aria-live="polite"
                    ></div>


                    <!-- Explanation -->
                    <div
                        id="explanation"
                        class="explanation hidden"
                    >

                        <div class="explanation-title">
                            💡 Explanation
                        </div>

                        <div
                            id="explanation-text"
                            class="explanation-text"
                        ></div>

                    </div>

                </section>

            </div>

        </section>

    </section>

</main>

<!-- =================================================
     JAVASCRIPT
     ================================================= -->

<script
    src="app.js"
    defer
></script>
```

</body>
</html>
