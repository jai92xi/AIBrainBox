<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AIBrainBox - Challenge yourself and learn something new."
    >

    <title>AI Brain Box</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =====================================================
         BACKGROUND VIDEO
         ===================================================== -->

    <video
        id="session-background"
        autoplay
        muted
        loop
        playsinline
        aria-hidden="true"
    ></video>

    <div
        id="background-overlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN APP
         ===================================================== -->

    <main class="app-container">

        <!-- =================================================
             AI BRAIN BOX HEADER
             ================================================= -->

        <header class="brain-box-header">

            <h1>
                🧠 AI Brain Box
            </h1>

            <p>
                Challenge yourself. Learn something new.
            </p>

        </header>


        <!-- =================================================
             MOTIVATIONAL QUOTE
             ================================================= -->

        <aside class="quote-container">

            <div class="quote">

                <span id="quote-text">
                    “Keep going. Your future self will thank you.”
                </span>

                <span id="quote-author">
                    — AIBrainBox
                </span>

            </div>

        </aside>


        <!-- =================================================
             LOADING
             ================================================= -->

        <div
            id="loading"
        >
            Loading questions...
        </div>


        <!-- =================================================
             ERROR
             ================================================= -->

        <div
            id="error"
            class="hidden"
        >
            Unable to load questions. Please refresh the page.
        </div>


        <!-- =================================================
             QUESTION CONTAINER
             ================================================= -->

        <section
            id="question-container"
            class="hidden"
        >

            <!-- =============================================
                 QUESTION + OPTIONS
                 ============================================= -->

            <div class="quiz-content">


                <!-- =========================================
                     QUESTION
                     ========================================= -->

                <section class="question-panel">

                    <p id="question">
                        Question will appear here.
                    </p>

                </section>


                <!-- =========================================
                     OPTIONS
                     ========================================= -->

                <section class="options-panel">

                    <div id="options">
                        <!-- Options generated by app.js -->
                    </div>

                </section>

            </div>


            <!-- =============================================
                 RESULT
                 ============================================= -->

            <div
                id="result"
                aria-live="polite"
            ></div>


            <!-- =============================================
                 EXPLANATION
                 ============================================= -->

            <section
                id="explanation"
                class="hidden"
            >

                <p id="explanation-text"></p>

            </section>


            <!-- =============================================
                 NAVIGATION
                 ============================================= -->

            <nav
                class="navigation"
                aria-label="Question navigation"
            >

                <button
                    id="previous-button"
                    type="button"
                >
                    ← Previous
                </button>


                <!-- Kept for compatibility with app.js.
                     Question number is intentionally hidden. -->

                <span
                    id="question-position"
                    aria-hidden="true"
                ></span>


                <div id="score-display">
                    🔥 Current streak:
                    <strong>0</strong>
                </div>


                <button
                    id="next-button"
                    type="button"
                >
                    Next →
                </button>

            </nav>

        </section>

    </main>


    <!-- =====================================================
         APP JAVASCRIPT
         ===================================================== -->

    <script src="app.js"></script>

</body>

</html>
