<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AIBrainBox — AI Questions, Practice, Learn and Improve."
    >

    <title>AIBrainBox</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="container">

        <!-- =====================================================
             HEADER
             ===================================================== -->

        <header class="header">

            <div class="header-top">

                <!-- Brand -->
                <div class="brand">

                    <span class="brand-icon">
                        🧠
                    </span>

                    <span class="brand-name">
                        AIBrainBox
                    </span>

                </div>


                <!-- Motivational Quote -->
                <aside
                    id="motivational-quote"
                    class="motivational-quote"
                    aria-label="Motivational quote"
                >

                    <span id="quote-text">
                        “Keep going. Your future self will thank you.”
                    </span>

                    <span
                        id="quote-author"
                        class="quote-author"
                    >
                        — AIBrainBox
                    </span>

                </aside>

            </div>


            <!-- Tagline -->
            <p class="tagline">
                AI Questions • Practice • Learn • Improve
            </p>

        </header>


        <!-- =====================================================
             LOADING
             ===================================================== -->

        <section
            id="loading"
            class="loading"
        >
            Loading question...
        </section>


        <!-- =====================================================
             ERROR
             ===================================================== -->

        <section
            id="error"
            class="error hidden"
            role="alert"
        ></section>


        <!-- =====================================================
             QUIZ
             ===================================================== -->

        <section
            id="question-container"
            class="hidden"
        >

            <!-- =================================================
                 TOP NAVIGATION
                 ================================================= -->

            <nav
                id="question-navigation"
                class="question-navigation"
                aria-label="Question navigation"
            >

                <button
                    id="previous-question-btn"
                    type="button"
                >
                    ← Previous
                </button>


                <div
                    id="question-position"
                    class="question-position"
                >
                    Question 1 of 5
                </div>


                <div
                    id="score-display"
                    class="score-display"
                >
                    Your current streak -
                    <strong>0/0</strong>
                </div>


                <button
                    id="next-question-btn"
                    type="button"
                >
                    Next →
                </button>

            </nav>


            <!-- =================================================
                 QUESTION CARD
                 ================================================= -->

            <div class="question-card">

                <div class="quiz-layout">


                    <!-- =========================================
                         QUESTION - LEFT
                         ========================================= -->

                    <section class="question-panel">

                        <div class="panel-label">
                            QUESTION
                        </div>

                        <div
                            id="question"
                            class="question"
                        ></div>

                    </section>


                    <!-- =========================================
                         OPTIONS - RIGHT
                         ========================================= -->

                    <section class="options-panel">

                        <div class="panel-label">
                            SELECT YOUR ANSWER
                        </div>


                        <div
                            id="options"
                            class="options"
                            role="radiogroup"
                            aria-label="Answer options"
                        ></div>


                        <!-- Answer result -->

                        <div
                            id="result"
                            class="result"
                            aria-live="polite"
                        ></div>


                        <!-- Explanation -->

                        <div
                            id="explanation"
                            class="explanation hidden"
                        >

                            <div class="explanation-title">
                                💡 Explanation
                            </div>

                            <div
                                id="explanation-text"
                                class="explanation-text"
                            ></div>

                        </div>

                    </section>

                </div>

            </div>

        </section>


        <!-- =====================================================
             FOOTER
             ===================================================== -->

        <footer class="footer">

            <p>
                Keep learning. Keep improving. 🚀
            </p>

        </footer>

    </main>


    <script src="app.js"></script>

</body>

</html>
