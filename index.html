<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Brain Box</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =====================================================
         BACKGROUND VIDEO
         ===================================================== -->

    <video
        id="session-background"
        autoplay
        muted
        loop
        playsinline
    ></video>

    <div id="background-overlay"></div>


    <!-- =====================================================
         MAIN CONTAINER
         ===================================================== -->

    <main class="container">


        <!-- =================================================
             AI BRAIN BOX HEADER
             ================================================= -->

        <section class="brain-box-header">

            <div class="brain-box-content">

                <h1 class="brain-box-title">
                    🧠 AI Brain Box
                </h1>

                <p>
                    Challenge yourself. Learn something new.
                </p>

            </div>


            <!-- =============================================
                 MOTIVATIONAL QUOTE
                 ============================================= -->

            <aside
                id="motivational-quote"
                class="motivational-quote"
            >

                <span id="quote-text">
                    “Keep going. Your future self will thank you.”
                </span>

                <span
                    id="quote-author"
                    class="quote-author"
                >
                    — AIBrainBox
                </span>

            </aside>

        </section>


        <!-- =================================================
             LOADING
             ================================================= -->

        <div id="loading">
            Loading questions...
        </div>


        <!-- =================================================
             ERROR
             ================================================= -->

        <div
            id="error"
            class="hidden"
        ></div>


        <!-- =================================================
             QUESTION CONTAINER
             ================================================= -->

        <section
            id="question-container"
            class="hidden"
        >


            <!-- =============================================
                 NAVIGATION
                 ============================================= -->

            <div class="quiz-navigation">


                <!-- Previous -->

                <button
                    id="previous-button"
                    class="nav-button"
                    type="button"
                >
                    ← Previous
                </button>


                <!-- Question position
                     Kept for JS compatibility but hidden
                     through CSS. -->

                <div
                    id="question-position"
                    class="question-position"
                ></div>


                <!-- Current streak -->

                <div
                    id="score-display"
                    class="score-display"
                >
                    🔥 Current streak:
                    <strong>0</strong>
                </div>


                <!-- Next -->

                <button
                    id="next-button"
                    class="nav-button"
                    type="button"
                >
                    Next →
                </button>

            </div>


            <!-- =============================================
                 QUESTION CARD
                 ============================================= -->

            <div class="question-card">


                <!-- =========================================
                     TWO COLUMN QUIZ LAYOUT
                     ========================================= -->

                <div class="quiz-layout">


                    <!-- =====================================
                         LEFT: QUESTION
                         ===================================== -->

                    <section class="question-panel">

                        <div class="question-label">
                            Question
                        </div>

                        <h2
                            id="question"
                            class="question"
                        >
                            Loading question...
                        </h2>

                    </section>


                    <!-- =====================================
                         RIGHT: OPTIONS + EXPLANATION
                         ===================================== -->

                    <section class="options-panel">

                        <div class="options-label">
                            Select your answer
                        </div>


                        <!-- Answer options -->

                        <div id="options"></div>


                        <!-- Result -->

                        <div id="result"></div>


                        <!-- =================================
                             Explanation
                             ================================= -->

                        <div
                            id="explanation"
                            class="explanation hidden"
                        >

                            <h3 class="explanation-title">
                                💡 Explanation
                            </h3>

                            <p id="explanation-text"></p>

                        </div>

                    </section>

                </div>

            </div>

        </section>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <footer>
            AI Brain Box • Practice • Learn • Improve
        </footer>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="app.js"></script>

</body>
</html>
