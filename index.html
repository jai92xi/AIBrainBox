<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AIBrainBox - AI Questions & Practice"
    >

    <title>AIBrainBox | AI Questions & Practice</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

        <div class="header-content">

            <div class="logo">
                🧠
            </div>

            <div class="header-text">

                <h1>
                    AIBrainBox
                </h1>

                <p>
                    AI Questions &amp; Practice
                </p>

            </div>

        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main>

        <!-- Loading -->

        <div
            id="loading"
            class="status-message"
        >
            Loading question...
        </div>


        <!-- Error -->

        <div
            id="error"
            class="hidden"
            role="alert"
        >
        </div>


        <!-- =================================================
             QUESTION CONTAINER
             ================================================= -->

        <section
            id="question-container"
            class="hidden"
            aria-label="Quiz question"
        >

            <!-- =================================================
                 TWO COLUMN LAYOUT
                 ================================================= -->

            <div class="quiz-layout">


                <!-- ================= QUESTION ================= -->

                <section class="question-panel">

                    <div class="panel-label">
                        🧠 QUESTION
                    </div>

                    <div id="question">
                    </div>

                </section>


                <!-- ================= OPTIONS ================= -->

                <section class="options-panel">

                    <div class="panel-label">
                        🤖 SELECT YOUR ANSWER
                    </div>

                    <div
                        id="options"
                        role="radiogroup"
                        aria-label="Answer options"
                    >
                    </div>

                </section>

            </div>


            <!-- =================================================
                 RESULT
                 ================================================= -->

            <div
                id="result"
                aria-live="polite"
            >
            </div>


            <!-- =================================================
                 EXPLANATION BUTTON
                 ================================================= -->

            <button
                id="show-explanation-btn"
                class="hidden"
                type="button"
                onclick="toggleExplanation()"
            >
                💡 Show Explanation
            </button>


            <!-- =================================================
                 EXPLANATION
                 ================================================= -->

            <div
                id="explanation"
                class="hidden"
            >

                <h3>
                    💡 Explanation
                </h3>

                <div id="explanation-text">
                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <p>
            🧠 AIBrainBox • AI Questions &amp; Practice
        </p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="app.js"></script>

</body>

</html>
