<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AI Brain Box - Challenge yourself and learn something new."
    >

    <title>AI Brain Box</title>


    <!-- =====================================================
         STYLESHEET
         ===================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         BACKGROUND VIDEO
         ===================================================== -->

    <video
        id="session-background"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    ></video>


    <!-- =====================================================
         DARK BACKGROUND OVERLAY
         ===================================================== -->

    <div
        id="background-overlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN PAGE
         ===================================================== -->

    <main
        class="page-container"
    >


        <!-- =================================================
             HEADER
             ================================================= -->

        <header
            class="brain-box-header"
        >


            <!-- ---------------------------------------------
                 BRAND
                 --------------------------------------------- -->

            <div
                class="brand-section"
            >

                <h1>

                    <span
                        class="brain-icon"
                        aria-hidden="true"
                    >
                        🧠
                    </span>

                    AI Brain Box

                </h1>


                <p>
                    Challenge yourself. Learn something new.
                </p>

            </div>


            <!-- ---------------------------------------------
                 MOTIVATIONAL QUOTE
                 --------------------------------------------- -->

            <aside
                class="quote-section"
            >

                <div
                    id="quote-text"
                    class="quote-text"
                >
                    “Learning never stops.”
                </div>


                <div
                    id="quote-author"
                    class="quote-author"
                >
                    — AIBrainBox
                </div>

            </aside>


        </header>


        <!-- =================================================
             CURRENT STREAK
             ================================================= -->

        <div
            id="score-display"
            class="score-display"
        >
            🔥 Current streak:
            <strong>0/0</strong>
        </div>


        <!-- =================================================
             LOADING
             ================================================= -->

        <div
            id="loading"
            class="loading"
        >
            Loading questions...
        </div>


        <!-- =================================================
             ERROR
             ================================================= -->

        <div
            id="error"
            class="error hidden"
        >
            Unable to load questions.
        </div>


        <!-- =================================================
             QUESTION AREA
             ================================================= -->

        <section
            id="question-container"
            class="question-container hidden"
        >


            <!-- =================================================
                 RELATED QUESTION NAVIGATION
                 
                 app.js dynamically creates:

                 Previous related question | Next related question
                 ================================================= -->

            <!--
                Do not add question IDs manually here.

                app.js generates the navigation dynamically
                from the CSV columns.
            -->


            <!-- =================================================
                 QUIZ WRAPPER
                 ================================================= -->

            <div
                class="quiz-wrapper"
            >


                <!-- =================================================
                     QUESTION CARD
                     ================================================= -->

                <section
                    class="question-panel"
                >

                    <div
                        class="panel-label"
                    >
                        QUESTION
                    </div>


                    <div
                        id="question"
                        class="question-text"
                    >
                        Question loading...
                    </div>

                </section>


                <!-- =================================================
                     OPTIONS CARD
                     ================================================= -->

                <section
                    class="options-panel"
                >


                    <div
                        class="panel-label"
                    >
                        CHOOSE YOUR ANSWER
                    </div>


                    <!-- ---------------------------------------------
                         OPTIONS
                         --------------------------------------------- -->

                    <div
                        id="options"
                        class="options"
                    >
                    </div>


                    <!-- ---------------------------------------------
                         ANSWER RESULT
                         --------------------------------------------- -->

                    <div
                        id="result"
                        class="result"
                    >
                    </div>


                    <!-- ---------------------------------------------
                         EXPLANATION
                         
                         Automatically displayed after answer.
                         --------------------------------------------- -->

                    <div
                        id="explanation"
                        class="explanation hidden"
                    >

                        <div
                            class="explanation-title"
                        >
                            💡 Explanation
                        </div>


                        <div
                            id="explanation-text"
                            class="explanation-text"
                        >
                        </div>

                    </div>


                </section>


            </div>


        </section>


    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="app.js"
    ></script>


</body>

</html>
