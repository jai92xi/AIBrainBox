<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AIBrainBox — practice AI questions, test your knowledge, and improve your skills."
    >

    <title>🧠AIBrainBox</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="container">

        <!-- =====================================================
             HEADER
             ===================================================== -->

        <header class="header">

            <h1>
                🧠AIBrainBox
            </h1>

            <p>
                AI Questions • Practice • Learn • Improve
            </p>

        </header>


        <!-- =====================================================
             MOTIVATIONAL QUOTE
             ===================================================== -->

        <aside
            id="motivational-quote"
            class="motivational-quote"
            aria-label="Motivational quote"
        >

            <span id="quote-text">
                “Keep going. Your future self will thank you.”
            </span>

            <span
                id="quote-author"
                class="quote-author"
            >
                — AIBrainBox
            </span>

        </aside>


        <!-- =====================================================
             HIGHLIGHTER
             ===================================================== -->

        <button
            id="highlighter-btn"
            class="highlighter-dot"
            type="button"
            aria-label="Turn highlighter on"
            aria-pressed="false"
            title="Highlight text"
        >

            <span
                class="highlighter-dot-inner"
                aria-hidden="true"
            ></span>

        </button>


        <!-- =====================================================
             LOADING
             ===================================================== -->

        <section
            id="loading"
            class="loading"
        >
            Loading question...
        </section>


        <!-- =====================================================
             ERROR
             ===================================================== -->

        <section
            id="error"
            class="error hidden"
            role="alert"
        ></section>


        <!-- =====================================================
             QUIZ
             ===================================================== -->

        <section
            id="question-container"
            class="hidden"
        >

            <div class="question-card">

                <!-- =================================================
                     QUESTION
                     ================================================= -->

                <div
                    class="question-section"
                >

                    <div class="panel-label">
                        QUESTION
                    </div>

                    <div
                        id="question"
                        class="question"
                    ></div>

                </div>


                <!-- =================================================
                     ANSWER OPTIONS
                     ================================================= -->

                <div
                    class="options-section"
                >

                    <div class="panel-label">
                        SELECT YOUR ANSWER
                    </div>

                    <div
                        id="options"
                        class="options"
                        role="radiogroup"
                        aria-label="Answer options"
                    ></div>

                </div>


                <!-- =================================================
                     ANSWER RESULT
                     ================================================= -->

                <div
                    id="result"
                    aria-live="polite"
                ></div>


                <!-- =================================================
                     EXPLANATION
                     ================================================= -->

                <div
                    id="explanation"
                    class="explanation hidden"
                >

                    <h2>
                        Explanation
                    </h2>

                    <div
                        id="explanation-text"
                    ></div>

                </div>


                <!-- =================================================
                     NAVIGATION
                     Automatically managed by app.js
                     ================================================= -->

            </div>

        </section>


        <!-- =====================================================
             FOOTER
             ===================================================== -->

        <footer class="footer">

            <p>
                Keep learning. Keep improving. 🚀
            </p>

        </footer>

    </main>


    <script src="app.js"></script>

</body>

</html>
