<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Brain Box</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         BACKGROUND OVERLAY
         ===================================================== -->

    <div
        id="background-overlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN APPLICATION
         ===================================================== -->

    <main class="app">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="brain-box-header">


            <!-- =============================================
                 BRAND
                 ============================================= -->

            <div class="brand-section">

                <div class="brand-title">

                    <span class="brain-icon">
                        🧠
                    </span>

                    <span>
                        AI Brain Box
                    </span>

                </div>


                <div class="brand-subtitle">

                    Challenge yourself.
                    Learn something new.

                </div>

            </div>


            <!-- =============================================
                 MOTIVATIONAL QUOTE
                 ============================================= -->

            <aside
                class="quote-section"
                aria-label="Motivational quote"
            >

                <div
                    id="quote-text"
                    class="quote-text"
                >
                    “Learning never stops.”
                </div>


                <div
                    id="quote-author"
                    class="quote-author"
                >
                    — AIBrainBox
                </div>

            </aside>


            <!-- =============================================
                 CURRENT STREAK
                 ============================================= -->

            <div
                id="score-display"
                class="score-display"
                aria-live="polite"
            >
                🔥 Current streak:
                <strong>0/0</strong>
            </div>


        </header>


        <!-- =================================================
             LOADING MESSAGE
             ================================================= -->

        <div
            id="loading"
            class="loading"
        >
            Loading questions...
        </div>


        <!-- =================================================
             ERROR MESSAGE
             ================================================= -->

        <div
            id="error"
            class="error hidden"
        >
            Unable to load questions.
            Please refresh the page.
        </div>


        <!-- =================================================
             QUESTION AREA
             ================================================= -->

        <section
            id="question-container"
            class="question-container hidden"
        >


            <!-- =============================================
                 MAIN QUIZ GRID
                 ============================================= -->

            <div class="quiz-grid">


                <!-- =========================================
                     QUESTION COLUMN
                     ========================================= -->

                <section
                    class="question-panel"
                    aria-label="Question"
                >


                    <!-- =====================================
                         QUESTION LABEL
                         ===================================== -->

                    <div class="section-label">
                        QUESTION
                    </div>


                    <!-- =====================================
                         QUESTION TEXT
                         ===================================== -->

                    <div
                        id="question"
                        class="question"
                    >
                        Loading question...
                    </div>


                </section>


                <!-- =========================================
                     OPTIONS COLUMN
                     ========================================= -->

                <section
                    class="options-panel"
                    aria-label="Answer options"
                >


                    <!-- =====================================
                         OPTIONS HEADER
                         ===================================== -->

                    <div class="section-label">
                        CHOOSE YOUR ANSWER
                    </div>


                    <!-- =====================================
                         ANSWER OPTIONS
                         ===================================== -->

                    <div
                        id="options"
                        class="options"
                    >

                        <!--
                            Options are generated
                            dynamically by app.js
                        -->

                    </div>


                    <!-- =====================================
                         RESULT
                         ===================================== -->

                    <div
                        id="result"
                        class="result"
                        aria-live="polite"
                    ></div>


                    <!-- =====================================
                         EXPLANATION
                         ===================================== -->

                    <div
                        id="explanation"
                        class="explanation hidden"
                    >


                        <div
                            class="explanation-title"
                        >

                            <span>
                                💡
                            </span>

                            <span>
                                Explanation
                            </span>

                        </div>


                        <div
                            id="explanation-text"
                            class="explanation-text"
                        ></div>


                    </div>


                </section>


            </div>


            <!-- =================================================
                 SIDE NAVIGATION
                 ================================================= -->

            <!--
                These are intentionally outside the two
                content cards.

                app.js creates the actual ← and → buttons
                dynamically.

                CSS positions them beside the two columns
                on desktop and keeps them compact on mobile.
            -->


        </section>


    </main>


    <!-- =====================================================
         APPLICATION JAVASCRIPT
         ===================================================== -->

    <script
        src="app.js"
    ></script>


</body>

</html>
