<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AIBrainBox - AI Questions & Practice"
    >

    <title>AIBrainBox | AI Questions & Practice</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

        <div class="header-content">

            <h1>
                🧠 AIBrainBox
            </h1>

            <p>
                AI Questions &amp; Practice
            </p>

        </div>

    </header>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main>

        <!-- Loading State -->

        <div
            id="loading"
            class="status-message"
        >
            Loading question...
        </div>


        <!-- Error State -->

        <div
            id="error"
            class="hidden"
            role="alert"
        >
        </div>


        <!-- =================================================
             QUESTION CONTAINER
             ================================================= -->

        <section
            id="question-container"
            class="hidden"
            aria-label="Quiz question"
        >


            <!-- Question Header -->

            <div class="question-header">

                <span id="question-id"></span>

                <span id="topic"></span>

            </div>


            <!-- Question -->

            <div
                id="question"
                class="question-card"
            >
            </div>


            <!-- =================================================
                 ANSWER OPTIONS
                 ================================================= -->

            <div
                id="options"
                role="radiogroup"
                aria-label="Answer options"
            >
            </div>


            <!-- =================================================
                 SUBMIT BUTTON
                 ================================================= -->

            <button
                id="submit-btn"
                type="button"
                onclick="submitAnswer()"
            >
                Submit Answer
            </button>


            <!-- =================================================
                 RESULT
                 ================================================= -->

            <div
                id="result"
                role="status"
                aria-live="polite"
            >
            </div>


            <!-- =================================================
                 EXPLANATION
                 ================================================= -->

            <div
                id="explanation"
                class="hidden"
            >

                <h3>
                    Explanation
                </h3>

                <div
                    id="explanation-text"
                >
                </div>

            </div>


            <!-- =================================================
                 COPY QUESTION LINK
                 ================================================= -->

            <button
                id="copy-btn"
                type="button"
                onclick="copyLink()"
            >
                🔗 Copy Question Link
            </button>


        </section>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <p>
            AIBrainBox
        </p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="app.js"></script>

</body>

</html>
