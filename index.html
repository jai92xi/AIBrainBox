
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A box full of Ahaaaaaaa questions!!"
    >

    <title>AIBrainBox</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="light-theme">

    <!-- Background -->
    <div
        id="background-overlay"
        aria-hidden="true"
    ></div>

    <!-- Main Page -->
    <main class="page-wrapper">

        <!-- Combined Header Box -->
        <header class="brain-box-header">

            <div class="brand-area">

                <div class="brand-title">
                    🧠 AIBrainBox
                </div>

                <div class="brand-tagline">
                    A box full of Ahaaaaaaa questions!!
                </div>

                <!-- Retained for app.js compatibility -->
                <div
                    class="brand-subtitle"
                    style="display: none;"
                ></div>

            </div>

            <!-- Current Streak -->
            <div
                id="score-display"
                class="score-display"
                aria-live="polite"
            >
                Current streak:
                <strong>0</strong>
            </div>

            <!-- Motivational Quote -->
            <div class="quote-section">

                <div
                    id="quote-text"
                    class="quote-text"
                >
                    “Keep learning. Keep improving.”
                </div>

                <div
                    id="quote-author"
                    class="quote-author"
                >
                    — AIBrainBox
                </div>

            </div>

        </header>

        <!-- Quiz Area -->
        <section
            id="quiz-area"
            class="quiz-area"
        >

            <!-- Error Message -->
            <div
                id="error"
                class="error hidden"
                role="alert"
            ></div>

            <!-- Question Container -->
            <section
                id="question-container"
                class="question-container hidden"
            >

                <!-- Sequential Question Navigation -->
                <nav
                    class="related-navigation"
                    aria-label="Sequential question navigation"
                >

                    <button
                        id="previous-question"
                        class="related-question previous-related"
                        type="button"
                        aria-label="Previous question"
                        title="Previous question"
                        disabled
                    >
                        <span aria-hidden="true">←</span>
                    </button>

                    <button
                        id="next-question"
                        class="related-question next-related"
                        type="button"
                        aria-label="Next question"
                        title="Next question"
                    >
                        <span aria-hidden="true">→</span>
                    </button>

                </nav>

                <!-- Quiz Content -->
                <div class="quiz-columns">

                    <!-- Question Pane -->
                    <section
                        class="question-pane"
                        aria-labelledby="question-label"
                    >

                        <div
                            id="question-label"
                            class="pane-label"
                        >
                            Question
                        </div>

                        <div
                            id="question"
                            class="question"
                        ></div>

                    </section>

                    <!-- Answer Options Pane -->
                    <section
                        class="options-pane"
                        aria-label="Answer options"
                    >

                        <div class="pane-label">
                            Choose your answer
                        </div>

                        <!-- Options generated by app.js -->
                        <div
                            id="options"
                            class="options"
                        ></div>

                        <!-- Answer Result -->
                        <div
                            id="result"
                            class="result"
                            aria-live="polite"
                        ></div>

                        <!-- Explanation -->
                        <div
                            id="explanation"
                            class="explanation hidden"
                        >

                            <div class="explanation-title">
                                💡 Explanation
                            </div>

                            <div
                                id="explanation-text"
                                class="explanation-text"
                            ></div>

                        </div>

                    </section>

                </div>

            </section>

        </section>

    </main>

    <!-- Application JavaScript -->
    <script
        src="app.js"
        defer
    ></script>

</body>

</html>
