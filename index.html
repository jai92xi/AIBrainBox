<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AIBrainBox — practice AI questions, test your knowledge, and improve your skills."
    >

    <title>🧠 AIBrainBox</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <main class="container">

        <!-- =====================================================
             HEADER
             ===================================================== -->

        <header class="header">

            <div class="brand-icon">
                🧠
            </div>

            <h1>
                AIBrainBox
            </h1>

            <p>
                AI Questions • Practice • Learn • Improve * trail 2
            </p>

        </header>


        <!-- =====================================================
             MOTIVATIONAL QUOTE
             ===================================================== -->

        <aside
            id="motivational-quote"
            class="motivational-quote"
            aria-label="Motivational quote"
        >

            <div class="quote-icon">
                ✦
            </div>

            <div
                id="quote-text"
                class="quote-text"
            >
                Keep learning. Keep improving.
            </div>

            <div
                id="quote-author"
                class="quote-author"
            >
            </div>

        </aside>


        <!-- =====================================================
             LOADING
             ===================================================== -->

        <section
            id="loading"
            class="loading"
        >
            Loading question...
        </section>


        <!-- =====================================================
             ERROR
             ===================================================== -->

        <section
            id="error"
            class="error hidden"
            role="alert"
        >
        </section>


        <!-- =====================================================
             QUESTION CONTAINER
             ===================================================== -->

        <section
            id="question-container"
            class="hidden"
        >

            <!-- =================================================
                 TOP NAVIGATION
                 ================================================= -->

            <nav
                id="question-navigation"
                class="question-navigation"
                aria-label="Question navigation"
            >

                <button
                    id="previous-question-btn"
                    type="button"
                >
                    ← Previous
                </button>


                <div
                    id="question-position"
                    class="question-position"
                    aria-live="polite"
                >
                    Question
                </div>


                <button
                    id="next-question-btn"
                    type="button"
                >
                    Next →
                </button>

            </nav>


            <!-- =================================================
                 MAIN QUIZ CARD
                 ================================================= -->

            <div class="question-card">


                <!-- =================================================
                     TWO COLUMN CONTENT
                     ================================================= -->

                <div class="quiz-layout">


                    <!-- =============================================
                         QUESTION — LEFT
                         ============================================= -->

                    <section class="question-panel">

                        <div class="panel-label">
                            🧠 QUESTION
                        </div>

                        <div
                            id="question"
                            class="question"
                        >
                        </div>

                    </section>


                    <!-- =============================================
                         OPTIONS — RIGHT
                         ============================================= -->

                    <section class="options-panel">

                        <div class="panel-label">
                            🤖 SELECT YOUR ANSWER
                        </div>


                        <div
                            id="options"
                            class="options"
                            role="radiogroup"
                            aria-label="Answer options"
                        >
                        </div>


                        <!-- =========================================
                             RESULT
                             ========================================= -->

                        <div
                            id="result"
                            class="result"
                            aria-live="polite"
                        >
                        </div>


                        <!-- =========================================
                             EXPLANATION
                             ========================================= -->

                        <div
                            id="explanation"
                            class="explanation hidden"
                        >

                            <div class="explanation-title">
                                💡 Explanation
                            </div>

                            <div
                                id="explanation-text"
                                class="explanation-text"
                            >
                            </div>

                        </div>

                    </section>

                </div>

            </div>

        </section>


        <!-- =====================================================
             FOOTER
             ===================================================== -->

        <footer class="footer">

            <p>
                Keep learning. Keep improving. 🚀
            </p>

        </footer>

    </main>


    <script src="app.js"></script>

</body>

</html>
