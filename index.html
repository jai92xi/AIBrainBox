<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AI Brain Box — Test your AI and Machine Learning knowledge."
    >

    <title>AI Brain Box</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="light-theme">

    <!-- =====================================================
         BACKGROUND
         app.js dynamically inserts the selected background
         from Backgrounds_Folder.
         ===================================================== -->

    <div
        id="background-overlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN PAGE
         ===================================================== -->

    <main class="page-wrapper">

        <!-- =================================================
             TOP HEADER
             ================================================= -->

        <header class="brain-box-header">

            <div class="brand-area">

                <div class="brand-title">
                    🧠 AI Brain Box
                </div>

                <!-- Caption intentionally removed -->
                <div
                    class="brand-subtitle"
                    style="display:none;"
                ></div>

            </div>


            <!-- =================================================
                 CURRENT STREAK
                 ================================================= -->

            <div
                id="score-display"
                class="score-display"
                aria-live="polite"
            >
                🔥 Current streak:
                <strong>0/0</strong>
            </div>


            <!-- =================================================
                 QUOTE
                 Quote is kept INSIDE the top box.
                 ================================================= -->

            <div class="quote-section">

                <div
                    id="quote-text"
                    class="quote-text"
                >
                    “Keep learning. Keep improving.”
                </div>

                <div
                    id="quote-author"
                    class="quote-author"
                >
                    — AIBrainBox
                </div>

            </div>

        </header>


        <!-- =================================================
             PAGE CONTENT
             ================================================= -->

        <section
            id="quiz-area"
            class="quiz-area"
        >

            <!-- =================================================
                 LOADING
                 ================================================= -->

            <div
                id="loading"
                class="loading"
            >
                Loading question...
            </div>


            <!-- =================================================
                 ERROR
                 ================================================= -->

            <div
                id="error"
                class="error hidden"
                role="alert"
            ></div>


            <!-- =================================================
                 QUESTION CONTAINER
                 ================================================= -->

            <section
                id="question-container"
                class="question-container hidden"
            >

                <!--
                    Previous / Next related-question arrows
                    are inserted here by app.js.

                    They remain at the top and do not move
                    downward with the question/options.
                -->


                <!-- =================================================
                     TWO-COLUMN QUIZ LAYOUT
                     ================================================= -->

                <div class="quiz-columns">


                    <!-- =============================================
                         LEFT HALF — QUESTION
                         ============================================= -->

                    <section
                        class="question-pane"
                        aria-labelledby="question"
                    >

                        <div class="pane-label">
                            Question
                        </div>

                        <div
                            id="question"
                            class="question"
                        >
                        </div>

                    </section>


                    <!-- =============================================
                         RIGHT HALF — OPTIONS
                         ============================================= -->

                    <section
                        class="options-pane"
                        aria-label="Answer options"
                    >

                        <div class="pane-label">
                            Choose your answer
                        </div>


                        <!-- =========================================
                             OPTIONS
                             ========================================= -->

                        <div
                            id="options"
                            class="options"
                        >
                        </div>


                        <!-- =========================================
                             ANSWER RESULT
                             ========================================= -->

                        <div
                            id="result"
                            class="result"
                            aria-live="polite"
                        >
                        </div>


                        <!-- =========================================
                             EXPLANATION
                             app.js displays this immediately
                             after selecting an option.
                             ========================================= -->

                        <div
                            id="explanation"
                            class="explanation hidden"
                        >

                            <div class="explanation-title">
                                💡 Explanation
                            </div>

                            <div
                                id="explanation-text"
                                class="explanation-text"
                            >
                            </div>

                        </div>

                    </section>

                </div>

            </section>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="app.js"
        defer
    ></script>

</body>
</html>
