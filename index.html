<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Brain Box</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Video -->
    <video
        id="session-background"
        autoplay
        muted
        loop
        playsinline
    ></video>

    <div id="background-overlay"></div>


    <!-- Previous Question -->
    <button
        id="previous-button"
        type="button"
        class="side-nav previous-nav"
    >
        Previous question
    </button>


    <!-- Next Question -->
    <button
        id="next-button"
        type="button"
        class="side-nav next-nav"
    >
        Next question
    </button>


    <!-- Current Streak -->
    <div id="score-display" class="streak-box">
        🔥 Current streak:
        <strong>0</strong>
    </div>


    <main class="app-container">

        <!-- Header -->
        <header class="brain-box-header">

            <div class="brand">
                <h1>🧠 AI Brain Box</h1>
                <p>Challenge yourself. Learn something new.</p>
            </div>

            <aside class="quote-box">
                <div id="quote-text"></div>
                <div id="quote-author"></div>
            </aside>

        </header>


        <!-- Loading -->
        <div id="loading" class="loading">
            Loading questions...
        </div>


        <!-- Error -->
        <div id="error" class="error hidden"></div>


        <!-- Question -->
        <section
            id="question-container"
            class="question-container hidden"
        >

            <div class="quiz-layout">

                <!-- LEFT: QUESTION -->
                <section class="question-panel">

                    <div class="question-label">
                        Question
                    </div>

                    <h2 id="question"></h2>

                </section>


                <!-- RIGHT: OPTIONS + EXPLANATION -->
                <section class="options-panel">

                    <div class="options-label">
                        Choose your answer
                    </div>

                    <div id="options" class="options">
                        <!-- Options inserted by app.js -->
                    </div>


                    <!-- Result -->
                    <div id="result"></div>


                    <!-- Explanation directly below options -->
                    <section
                        id="explanation"
                        class="explanation hidden"
                    >

                        <div class="explanation-title">
                            💡 Explanation
                        </div>

                        <div id="explanation-text"></div>

                    </section>

                </section>

            </div>


            <!-- Compatibility element for app.js -->
            <div
                id="question-position"
                class="question-position"
                aria-hidden="true"
            ></div>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
