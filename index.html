<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AIBrainBox</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header>

        <div class="header-content">

            <div class="logo">
                🧠
            </div>

            <div>
                <h1>AIBrainBox</h1>
                <p>AI Questions & Practice</p>
            </div>

        </div>

    </header>


    <!-- =========================================================
         MAIN
         ========================================================= -->

    <main>

        <!-- Loading -->

        <div id="loading">
            Loading question...
        </div>


        <!-- Error -->

        <div id="error" class="hidden"></div>


        <!-- Question -->

        <div id="question-container" class="hidden">

            <!-- Question Header -->

            <div class="question-header">

                <span id="question-id"></span>

                <span id="topic"></span>

            </div>


            <!-- =================================================
                 TWO COLUMN QUIZ
                 ================================================= -->

            <div class="quiz-layout">


                <!-- =================================================
                     LEFT : QUESTION
                     ================================================= -->

                <section class="question-panel">

                    <div class="panel-label">
                        🧠 QUESTION
                    </div>

                    <div id="question"></div>

                </section>


                <!-- =================================================
                     RIGHT : OPTIONS
                     ================================================= -->

                <section class="options-panel">

                    <div class="panel-label">
                        🤖 SELECT YOUR ANSWER
                    </div>

                    <div id="options"></div>

                </section>

            </div>


            <!-- =================================================
                 RESULT
                 ================================================= -->

            <div id="result"></div>


            <!-- =================================================
                 EXPLANATION
                 ================================================= -->

            <button
                id="show-explanation-btn"
                class="hidden"
                onclick="toggleExplanation()"
            >
                💡 Show Explanation
            </button>


            <div
                id="explanation"
                class="hidden"
            >

                <h3>
                    💡 Explanation
                </h3>

                <div id="explanation-text"></div>

            </div>

        </div>

    </main>


    <!-- =========================================================
         FOOTER
         ========================================================= -->

    <footer>

        <p>
            🧠 AIBrainBox • AI Questions & Practice
        </p>

    </footer>


    <script src="app.js"></script>

</body>

</html>
